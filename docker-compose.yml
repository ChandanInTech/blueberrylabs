# Local development only. Production uses Railway PostgreSQL.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: social_resizer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d social_resizer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
